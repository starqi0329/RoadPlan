[package]
name = "roadplan"
version = "0.1.0"
description = "时序：桌面计划时间表"
authors = ["RoadPlan"]
edition = "2024"

[lib]
name = "roadplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[target.'cfg(windows)'.dependencies]
# 副窗的 WebView2 画面会停在 0×0。要直接调控制器的 SetBounds，不能只改外框。
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
